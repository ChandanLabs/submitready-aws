AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SubmitReady - scholarship application preflight workflow
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        APPLICATIONS_TABLE:
          Ref: ApplicationsTable
Resources:
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: applicationId
        AttributeType: S
      KeySchema:
      - AttributeName: applicationId
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ValidateFunction
      Handler: lambda.handler
    Metadata:
      SamResourceId: ValidateFunction
  PersistReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PersistReportFunction
      Handler: persist-report.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ApplicationsTable
    Metadata:
      SamResourceId: PersistReportFunction
  StartExecutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: StartExecutionFunction
      Handler: start-execution.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: ValidationStateMachine
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - states:StartExecution
          Resource:
            Ref: ValidationStateMachine
      Events:
        StartValidation:
          Type: HttpApi
          Properties:
            Path: /applications/{applicationId}/validate
            Method: POST
    Metadata:
      SamResourceId: StartExecutionFunction
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetReportFunction
      Handler: get-report.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ApplicationsTable
      Events:
        GetReport:
          Type: HttpApi
          Properties:
            Path: /applications/{applicationId}
            Method: GET
    Metadata:
      SamResourceId: GetReportFunction
  ValidationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        StartAt: Validate
        States:
          Validate:
            Type: Task
            Resource:
              Fn::GetAtt:
              - ValidateFunction
              - Arn
            ResultPath: $.validation
            Parameters:
              packet.$: $.packet
            Next: Persist
          Persist:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PersistReportFunction
              - Arn
            Parameters:
              applicationId.$: $.applicationId
              packet.$: $.packet
              report.$: $.validation.report
            End: true
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ValidateFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: PersistReportFunction
Outputs:
  ValidationApi:
    Description: SubmitReady validation start endpoint
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/applications/{applicationId}/validate
  ReportApi:
    Description: SubmitReady report endpoint
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/applications/{applicationId}
